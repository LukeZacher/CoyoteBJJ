<nav>
  <div class="container navbar flex-align-center">
    <!-- Site logo + name combo -->
    <a href="/" class="left-logo flex-align-center">
      <img src="" alt="Logo" />
      <span>Coyote BJJ</span>
    </a>
    <!-- Page links -->
    <div class="right-links flex-align-center">
      <ul class="page-links flex-align-center">
        @for (navbarLink of navbarLinks; track navbarLink.name) {
          <li>
            <a [href]="navbarLink.route">{{ navbarLink.name }}</a>
          </li>
        }
      </ul>
      <!-- Action buttons -->
      <ul class="action-btns flex-align-center">
        @for (actionBtn of actionBtns; track actionBtn.name) {
          <li>
            <a
              [href]="actionBtn.route"
              [class]="actionBtn.bgColor"
              class="action-btn btn-hover-glow"
              >{{ actionBtn.name }}</a
            >
          </li>
        }
      </ul>
      <!-- Social media icons -->
      <div class="social-links flex-align-center">
        <a href="" aria-label="Visit our Facebook page"><ng-icon name="facebook"></ng-icon></a
        ><a href="" aria-label="Visit our Instagram page"><ng-icon name="instagram"></ng-icon></a>
      </div>
    </div>
  </div>
</nav>
